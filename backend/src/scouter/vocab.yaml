# Canonical skill vocabulary. Order matters: it is the order skills are reported in.
# pattern: Python regex, case-insensitive. aliases: exact phrases (case-insensitive) that mean this skill.
- id: react
  label: 'React'
  pattern: '\breact(\.?js)?\b(?! native)'
  aliases: ['react']
- id: react-native
  label: 'React Native'
  pattern: 'react native'
  aliases: ['react-native', 'react native']
- id: nextjs
  label: 'Next.js'
  pattern: 'next\.?js'
  aliases: ['nextjs', 'next.js']
