services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 5433 on the host so it never clashes with a local Postgres on 5432
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports: ["127.0.0.1:9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 30
    restart: unless-stopped

  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    image: darb-scouter
    env_file: [{path: .env, required: false}]
    environment: &internal
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/postgres
      ELASTIC_URL: http://es:9200
    ports: ["127.0.0.1:8000:8000"]
    volumes: [models:/home/app/.cache]
    # healthy only after migrations ran and the server answers
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      retries: 30
    depends_on:
      db: {condition: service_healthy}
      es: {condition: service_healthy}
    restart: unless-stopped

  scheduler:
    image: darb-scouter
    pull_policy: never
    command: ["python", "-m", "scouter.scheduler"]
    env_file: [{path: .env, required: false}]
    environment: *internal
    volumes: [models:/home/app/.cache]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
  esdata:
  models:
